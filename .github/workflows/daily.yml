name: Daily brief

on:
  schedule:
    - cron: "30 1 * * *"        # 01:30 UTC = 07:00 India
  push:
    paths:
      - "data/**"
      - "*.py"
  workflow_dispatch:             # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # needed so it can commit the new page back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas

      - run: python main.py

      - name: Commit the regenerated page
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Daily brief"
          git push
